name: macOS release (Apple Silicon)

# Produces the thing a non-developer actually needs: a signed .app inside a
# BabelFishR-macOS-arm64.dmg, with a checksum and honest reports about what was
# and was not verified.
#
# Triggered by hand (workflow_dispatch) or by pushing a v* tag. A tag also
# publishes a GitHub prerelease.
#
# Two jobs, so the token that can write releases never meets the build:
#   build   - read-only token. Installs the hash-pinned lock, runs the whole
#             suite, builds, signs and packages, uploads the DMG and exposes
#             its sha256 as a job output.
#   publish - the only job with contents: write. It does not check out or
#             build anything: it downloads the artifact, re-checks the DMG
#             against the sha256 the build job reported, then publishes.
# Every action is pinned to a full commit SHA (the tag is in the comment);
# packaging/SUPPLY_CHAIN.md says how they and the Python lock were obtained.

on:
  workflow_dispatch:
    inputs:
      runner_label:
        description: "Apple Silicon runner label"
        required: false
        default: "macos-26"
      publish_prerelease:
        description: "Publish a prerelease from this run (needs release_tag)"
        required: false
        default: "false"
      release_tag:
        description: "Tag to create/publish, e.g. v0.1.0-alpha.1"
        required: false
        default: ""
  push:
    tags:
      - "v*"

# Nothing is granted by default; each job asks for exactly what it needs.
permissions: {}

concurrency:
  group: macos-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build, test and package on Apple Silicon
    runs-on: ${{ inputs.runner_label || 'macos-26' }}
    # A healthy run takes six minutes. Anything approaching this is wedged, and
    # holding a runner for two hours to discover that helps nobody.
    timeout-minutes: 40
    permissions:
      contents: read
    outputs:
      # The DMG's sha256 as the build job computed it. The publish job
      # re-hashes what it downloaded and refuses to publish on a mismatch.
      dmg_sha256: ${{ steps.dmg.outputs.sha }}

    steps:
      # ------------------------------------------------------------------
      # Architecture gate. This runs before anything else, and it is fatal.
      # An Intel build labelled arm64 would be worse than no build at all:
      # it would launch under Rosetta on the target Mac and nobody would know
      # why it was slow, or it would not launch at all.
      # ------------------------------------------------------------------
      - name: Verify this is an Apple Silicon runner
        env:
          RUNNER_LABEL: ${{ inputs.runner_label || 'macos-26' }}
        run: |
          set -euo pipefail
          ARCH="$(uname -m)"
          echo "uname -m      : $ARCH"
          echo "uname -a      : $(uname -a)"
          echo "sw_vers       : $(sw_vers -productName) $(sw_vers -productVersion)"
          echo "runner label  : $RUNNER_LABEL"
          {
            echo "### Runner architecture"
            echo ""
            echo '```'
            echo "uname -m   : $ARCH"
            echo "macOS      : $(sw_vers -productName) $(sw_vers -productVersion)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$ARCH" != "arm64" ]]; then
            echo "::error::This runner reports '$ARCH', not arm64. Refusing to" \
                 "build an Apple Silicon release on a non-Apple-Silicon machine."
            exit 1
          fi

      - name: Check out the source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # The build never pushes; no token is left in .git/config.
          persist-credentials: false

      - name: Install Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Record the toolchain
        run: |
          set -euo pipefail
          echo "python3       : $(python3 --version)"
          echo "python3 path  : $(command -v python3)"
          echo "python3 arch  : $(python3 -c 'import platform;print(platform.machine())')"
          echo "xcode         : $(xcodebuild -version 2>/dev/null | head -n 1 || echo 'n/a')"
          python3 -c "import platform,sys; assert platform.machine()=='arm64', \
            f'python3 is {platform.machine()}, not arm64'; \
            assert sys.version_info[:2]==(3,12), f'python is {sys.version}'"

      # ------------------------------------------------------------------
      # build_macos.sh creates its own clean venv, runs the WHOLE test suite,
      # builds the bundle, verifies it, signs it (Developer ID when the
      # secrets exist, ad-hoc otherwise), proves it is standalone, and builds
      # the DMG. Any failure in any of those stops the job.
      # ------------------------------------------------------------------
      - name: Build, test, verify, sign and package
        timeout-minutes: 45
        env:
          BABELFISHR_REPORT_DIR: build-reports
          BABELFISHR_MAKE_DMG: "1"
          CODESIGN_IDENTITY: ${{ secrets.CODESIGN_IDENTITY }}
          NOTARY_PROFILE: ${{ secrets.NOTARY_PROFILE }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p build-reports
          ./packaging/build_macos.sh 2>&1 | tee build-reports/build-log.txt

      - name: Re-verify the bundle independently of the build script
        run: |
          set -euo pipefail
          ./packaging/verify_bundle.sh dist/BabelFishR.app \
            2>&1 | tee -a build-reports/bundle-verification.txt

      # The uninstaller is the only thing in the release that can delete an
      # operator's recordings, so the pipeline exercises it - non-destructively
      # - rather than merely checking that a bundle exists. The dry run is
      # pointed at a scratch home; nothing on the runner is touched.
      - name: Re-verify the uninstaller bundle and run its dry run
        run: |
          set -euo pipefail
          UNINSTALLER="dist/Uninstall BabelFishR.app"
          BIN="$UNINSTALLER/Contents/MacOS/UninstallBabelFishR"
          [[ -x "$BIN" ]] || { echo "::error::$BIN missing"; exit 1; }
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' \
            "$UNINSTALLER/Contents/Info.plist" | grep -qx 'org.babelfishr.uninstaller'
          if /usr/libexec/PlistBuddy -c 'Print :NSMicrophoneUsageDescription' \
               "$UNINSTALLER/Contents/Info.plist" >/dev/null 2>&1; then
            echo "::error::the uninstaller declares a microphone usage string"
            exit 1
          fi
          if codesign -d --entitlements - --xml "$UNINSTALLER" 2>/dev/null \
               | grep -q 'com.apple.security.device.audio-input'; then
            echo "::error::the uninstaller was signed with the microphone entitlement"
            exit 1
          fi
          PROBE="$(mktemp -d)/probe-home"
          mkdir -p "$PROBE/Library/Application Support/BabelFishR/Recordings"
          echo keep > "$PROBE/Library/Application Support/BabelFishR/Recordings/keep.wav"
          "$BIN" --selftest-dry-run "$PROBE" \
            2>&1 | tee build-reports/uninstaller-dry-run.txt
          [[ -f "$PROBE/Library/Application Support/BabelFishR/Recordings/keep.wav" ]] \
            || { echo "::error::the dry run deleted a file"; exit 1; }
          rm -rf "$PROBE"

      - name: Collect the disk image and its checksum
        id: dmg
        run: |
          set -euo pipefail
          DMG="dist/BabelFishR-macOS-arm64.dmg"
          [[ -f "$DMG" ]] || { echo "::error::$DMG was not produced"; exit 1; }
          [[ -f "$DMG.sha256" ]] || { echo "::error::$DMG.sha256 missing"; exit 1; }
          # Hash the image itself rather than trusting the .sha256 file, and
          # require the two to agree: this value crosses the job boundary.
          SHA="$(shasum -a 256 "$DMG" | awk '{print $1}')"
          [[ "$SHA" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::bad sha256 '$SHA'"; exit 1; }
          [[ "$(awk '{print $1}' "$DMG.sha256")" == "$SHA" ]] || {
            echo "::error::$DMG.sha256 does not match the image"; exit 1; }
          SIZE="$(du -h "$DMG" | awk '{print $1}')"
          echo "dmg=$DMG"   >> "$GITHUB_OUTPUT"
          echo "sha=$SHA"   >> "$GITHUB_OUTPUT"
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"
          {
            echo ""
            echo "### Disk image"
            echo ""
            echo "| field | value |"
            echo "| --- | --- |"
            echo "| file | \`BabelFishR-macOS-arm64.dmg\` |"
            echo "| size | $SIZE |"
            echo "| sha256 | \`$SHA\` |"
            echo ""
            echo "### Signing"
            echo ""
            echo '```'
            sed -n '1,12p' build-reports/signing-status.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the disk image
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: BabelFishR-macOS-arm64-dmg
          path: |
            dist/BabelFishR-macOS-arm64.dmg
            dist/BabelFishR-macOS-arm64.dmg.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Upload the test, build, verification and signing reports
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: BabelFishR-macOS-reports
          path: build-reports/
          if-no-files-found: warn
          retention-days: 30

      # Echoed into the job log, after the uploads, so the outcome can be read
      # without downloading an artifact.
      - name: Print the verification and signing reports
        if: always()
        run: |
          set -euo pipefail
          for report in signing-status signing-status-uninstaller \
                        independence-report bundle-verification \
                        uninstaller-dry-run; do
            file="build-reports/$report.txt"
            echo "================ $file ================"
            [[ -f "$file" ]] && cat "$file" || echo "(not produced)"
            echo ""
          done
          echo "================ test summary ================"
          tail -n 12 build-reports/test-report.txt 2>/dev/null || echo "(none)"
          echo ""
          echo "================ CoreAudio, from the shipped bundle ================"
          # Printed on its own so the ABI result is visible without reading the
          # whole independence report. Hosted runners have no audio hardware,
          # so zero devices here is expected and is not hardware validation.
          sed -n '/CoreAudio probe/,/result  *:/p' \
            build-reports/independence-report.txt 2>/dev/null || echo "(none)"

  # ------------------------------------------------------------------
  # Publishing. A tag push publishes automatically; a manual run publishes
  # only when explicitly asked to, so probing the pipeline never creates a
  # release by accident. Everything below the 0.x line is a prerelease.
  # ------------------------------------------------------------------
  #
  # This is the only job that can write to the repository. It runs no code
  # from the checkout - there is no checkout - and publishes only an image
  # whose sha256 matches the one the build job computed.
  publish:
    name: Publish the prerelease
    needs: build
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' &&
       inputs.publish_prerelease == 'true' && inputs.release_tag != '')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Download the disk image
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: BabelFishR-macOS-arm64-dmg
          path: dist

      - name: Download the signing report the release notes are written from
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: BabelFishR-macOS-reports
          path: build-reports

      - name: Verify the image is the one the build job tested
        env:
          EXPECTED_SHA256: ${{ needs.build.outputs.dmg_sha256 }}
        run: |
          set -euo pipefail
          DMG="dist/BabelFishR-macOS-arm64.dmg"
          [[ -f "$DMG" ]] || { echo "::error::$DMG was not downloaded"; exit 1; }
          [[ "$EXPECTED_SHA256" =~ ^[0-9a-f]{64}$ ]] || {
            echo "::error::the build job reported no usable sha256: '$EXPECTED_SHA256'"; exit 1; }
          ACTUAL="$(sha256sum "$DMG" | awk '{print $1}')"
          FILE_SHA="$(awk '{print $1}' "$DMG.sha256")"
          echo "build job : $EXPECTED_SHA256"
          echo "downloaded: $ACTUAL"
          echo "sha256 file: $FILE_SHA"
          if [[ "$ACTUAL" != "$EXPECTED_SHA256" || "$FILE_SHA" != "$EXPECTED_SHA256" ]]; then
            echo "::error::the downloaded image is not the one the build job tested; refusing to publish"
            exit 1
          fi
          (cd dist && sha256sum -c BabelFishR-macOS-arm64.dmg.sha256)
          [[ -f build-reports/signing-status.txt ]] || {
            echo "::error::build-reports/signing-status.txt was not downloaded"; exit 1; }

      - name: Publish the prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # There is no checkout, so gh is told which repository to act on.
          GH_REPO: ${{ github.repository }}
          TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release_tag }}
          SHA256: ${{ needs.build.outputs.dmg_sha256 }}
        run: |
          set -euo pipefail
          NOTARIZED="$(grep -E '^notarized *:' build-reports/signing-status.txt \
                       | awk -F': *' '{print $2}' || echo unknown)"
          MODE="$(grep -E '^signing mode *:' build-reports/signing-status.txt \
                  | awk -F': *' '{print $2}' || echo unknown)"

          if [[ "$NOTARIZED" == "yes" ]]; then
            GATEKEEPER="This build is signed with a Developer ID certificate and notarized by Apple. It opens normally."
          else
            GATEKEEPER=$'**UNNOTARIZED ALPHA.** This build is '"$MODE"$' signed and has *not* been notarized by Apple.\nmacOS will refuse it on first launch. To open it: right-click (Control-click) **BabelFishR** in\nApplications, choose **Open**, then click **Open** in the dialog. You only have to do this once.'
          fi

          # Unquoted heredoc, because $TAG, $SHA256 and $GATEKEEPER must
          # expand. That means every backtick in the body has to be escaped:
          # an unescaped one is command substitution, and alpha 3 shipped
          # notes reading "type ." because the shell ran DELETE as a command
          # and put its (empty) output in the sentence.
          cat > release-notes.md <<NOTES
          ## BabelFishR $TAG — macOS (Apple Silicon)

          Download **BabelFishR-macOS-arm64.dmg**, open it, and drag BabelFishR to Applications.
          You do not need Python, Terminal, or this repository to run it.

          The disk image also contains **Uninstall BabelFishR.app** — see *Removing BabelFishR* below.

          $GATEKEEPER

          ### First launch
          1. Open BabelFishR from Applications.
          2. Approve the macOS audio-input permission request.
          3. Choose your input: the MacBook microphone for a bench test, or your USB
             audio interface for radio audio. **BabelFishR never picks one for you.**
          4. Complete first-run preparation in the setup window (this is the one step
             that needs internet — it downloads the speech model and language packages).
          5. Run Field Check, then disconnect from the network and work offline.

          ### Verify your download
          \`\`\`
          shasum -a 256 BabelFishR-macOS-arm64.dmg
          $SHA256
          \`\`\`

          ### Removing BabelFishR
          Open **BabelFishR-macOS-arm64.dmg** again and double-click **Uninstall BabelFishR**.
          It runs from the disk image; there is nothing to install for it, and it needs
          neither Python nor Terminal. It shows you the exact list of paths first, and
          deletes nothing until you tick the acknowledgement box *and* type \`DELETE\`.

          **Complete removal permanently deletes every recording BabelFishR has made,
          along with the transmission database, all transcripts and translations.
          Recordings cannot be recovered — nothing goes to the Trash.** It also removes
          the app itself, the Whisper models, the Argos language packs, your settings,
          the logs and diagnostic reports, and BabelFishR's caches, preferences and saved
          application state. Copy anything you want to keep somewhere else first.

          ### Not yet validated on physical hardware
          This build was produced and tested on a GitHub Apple Silicon runner. It has
          **not** been exercised against a real radio, a FalconClaw PTT interface, a USB
          audio interface, an SDR, or dsd-neo. Treat those paths as unvalidated until
          you have tested them yourself on your own Mac.
          NOTES

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              "dist/BabelFishR-macOS-arm64.dmg" \
              "dist/BabelFishR-macOS-arm64.dmg.sha256" --clobber
            gh release edit "$TAG" --prerelease --notes-file release-notes.md
          else
            gh release create "$TAG" \
              "dist/BabelFishR-macOS-arm64.dmg" \
              "dist/BabelFishR-macOS-arm64.dmg.sha256" \
              --title "BabelFishR $TAG (macOS Apple Silicon)" \
              --notes-file release-notes.md \
              --prerelease \
              --target "$GITHUB_SHA"
          fi
          echo "Release: $(gh release view "$TAG" --json url -q .url)" >> "$GITHUB_STEP_SUMMARY"
