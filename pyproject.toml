[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "babelfishr"
version = "0.3.0"
description = "Receive-only desktop app that records, transcribes and translates radio transmissions"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "BabelFishR contributors" }]
keywords = ["radio", "scanner", "transcription", "translation", "whisper", "gmrs", "vhf", "uhf"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: MacOS X",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS :: MacOS X",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Communications :: Ham Radio",
  "Topic :: Multimedia :: Sound/Audio :: Capture/Recording",
]

# The core runs on numpy alone: replay, detection, storage, export and the
# mock engines all work with no other dependency.
# tzdata: the official IANA time zone database as a small offline package,
# so named regions (America/Denver, Asia/Kathmandu) and their daylight
# saving history resolve the same on every platform - Windows has no system
# copy - and inside the frozen app, with no network lookup.
dependencies = ["numpy>=1.21", "tzdata>=2024.1"]

[project.optional-dependencies]
audio = ["sounddevice>=0.4.6"]
gui = ["PySide6>=6.5"]
# certifi: a frozen bundle has no system trust store, so the CA data has
# to be shipped with the application or every download fails.
# socksio: huggingface_hub's HTTP client (httpx2/httpcore2) honours the
# system proxy settings, and with a SOCKS proxy configured (ALL_PROXY=
# socks5h://...) it refuses to start without socksio - the model download
# failed before sending a single byte.
# huggingface-hub: the model download passes tqdm_class and an exact
# revision to hf_hub_download / snapshot_download (pinned commit, real byte
# progress). hf_hub_download only takes tqdm_class from 1.x, and the progress
# adapter's contract was checked against 2.4.0 (tests) and 2.5.0 (macOS
# build); faster-whisper alone would accept 0.21.
asr = ["faster-whisper>=1.0", "huggingface-hub>=2.4,<3", "certifi>=2023.7.22",
       "socksio>=1.0,<2"]
translate = ["argostranslate>=1.9", "certifi>=2023.7.22"]
cloud = ["anthropic>=0.40"]
# pyyaml lets the tests read the release workflow and check its
# shape, rather than grepping YAML with regular expressions.
# pytest-timeout turns a hung test into a failure with a stack
# trace naming it. A silent hang in CI tells you nothing.
dev = ["pytest>=7", "pyyaml>=6", "pytest-timeout>=2"]
packaging = ["pyinstaller>=6.0"]
all = [
  "sounddevice>=0.4.6",
  "PySide6>=6.5",
  "faster-whisper>=1.0",
  "huggingface-hub>=2.4,<3",
  "argostranslate>=1.9",
  "anthropic>=0.40",
  "certifi>=2023.7.22",
  "socksio>=1.0,<2",
]

[project.scripts]
babelfishr = "babelfishr.cli:main"

[project.gui-scripts]
babelfishr-gui = "babelfishr.ui:run"

[tool.setuptools.packages.find]
include = ["babelfishr*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
# Test categories, so "the suite passes" is never mistaken for "the real
# engines work". Only `unit` runs by default in CI and in this repo's
# development environment.
markers = [
  "unit: deterministic, no models, no network, no hardware (the default suite)",
  "real_model: needs a downloaded Whisper model or Argos language pack",
  "real_dsd: needs a real dsd-neo binary and known digital recordings",
  "macos_audio: needs a Mac with a real audio input device",
  "falconclaw: needs the physical radio and FalconClaw chain",
  "sdr: needs SDR hardware",
]
