[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "babelfishr"
version = "0.1.0"
description = "Receive, decode, record and translate radio transmissions across the spectrum"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "BabelFishR contributors" }]
keywords = ["radio", "sdr", "vhf", "uhf", "gmrs", "aprs", "pocsag", "whisper", "translation"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Communications :: Ham Radio",
]

# Core runtime needs only numpy. Everything else degrades gracefully.
dependencies = ["numpy>=1.21"]

[project.optional-dependencies]
audio = ["sounddevice>=0.4.6"]
asr = ["faster-whisper>=1.0"]
translate = ["argostranslate>=1.9"]
cloud = ["anthropic>=0.40"]
sdr = ["SoapySDR"]
dev = ["pytest>=7", "scipy>=1.9"]
all = ["sounddevice>=0.4.6", "faster-whisper>=1.0", "argostranslate>=1.9", "anthropic>=0.40"]

[project.scripts]
babelfishr = "babelfishr.cli:main"

[tool.setuptools.packages.find]
include = ["babelfishr*"]

[tool.setuptools.package-data]
"babelfishr.server" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
