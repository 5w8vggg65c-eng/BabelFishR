[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "babelfishr"
version = "0.3.0"
description = "Receive-only desktop app that records, transcribes and translates radio transmissions"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "BabelFishR contributors" }]
keywords = ["radio", "scanner", "transcription", "translation", "whisper", "gmrs", "vhf", "uhf"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: MacOS X",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS :: MacOS X",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Communications :: Ham Radio",
  "Topic :: Multimedia :: Sound/Audio :: Capture/Recording",
]

# The core runs on numpy alone: replay, detection, storage, export and the
# mock engines all work with no other dependency.
dependencies = ["numpy>=1.21"]

[project.optional-dependencies]
audio = ["sounddevice>=0.4.6"]
gui = ["PySide6>=6.5"]
# certifi: a frozen bundle has no system trust store, so the CA data has
# to be shipped with the application or every download fails.
asr = ["faster-whisper>=1.0", "certifi>=2023.7.22"]
translate = ["argostranslate>=1.9", "certifi>=2023.7.22"]
cloud = ["anthropic>=0.40"]
# pyyaml lets the tests read the release workflow and check its
# shape, rather than grepping YAML with regular expressions.
# pytest-timeout turns a hung test into a failure with a stack
# trace naming it. A silent hang in CI tells you nothing.
dev = ["pytest>=7", "pyyaml>=6", "pytest-timeout>=2"]
packaging = ["pyinstaller>=6.0"]
all = [
  "sounddevice>=0.4.6",
  "PySide6>=6.5",
  "faster-whisper>=1.0",
  "argostranslate>=1.9",
  "anthropic>=0.40",
  "certifi>=2023.7.22",
]

[project.scripts]
babelfishr = "babelfishr.cli:main"

[project.gui-scripts]
babelfishr-gui = "babelfishr.ui:run"

[tool.setuptools.packages.find]
include = ["babelfishr*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
# Test categories, so "the suite passes" is never mistaken for "the real
# engines work". Only `unit` runs by default in CI and in this repo's
# development environment.
markers = [
  "unit: deterministic, no models, no network, no hardware (the default suite)",
  "real_model: needs a downloaded Whisper model or Argos language pack",
  "real_dsd: needs a real dsd-neo binary and known digital recordings",
  "macos_audio: needs a Mac with a real audio input device",
  "falconclaw: needs the physical radio and FalconClaw chain",
  "sdr: needs SDR hardware",
]
